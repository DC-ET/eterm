[package]
# frb/cargokit 约定：crate 名决定产物 librust_lib_eterm.a / dylib，与 rust_builder pod 对齐
name = "rust_lib_eterm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes-gcm = "0.10"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
# SSH 会话（S2 spike 移植；版本与 spike 一致）
russh = "0.46"
russh-keys = "0.46"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# 版本与 flutter_rust_bridge_codegen 保持一致（当前 codegen v2.13.0）
flutter_rust_bridge = "=2.13.0"

[dev-dependencies]
tempfile = "3"

# macOS 钥匙串（LKMK 存取）；Android 侧 M1 用平台沙箱目录兜底
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"
