name: eterm
description: "eterm 客户端（服务端数据中枢的用户壳）"
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  window_manager: ^0.7.0
  freezed_annotation: ^2.4.4
  rust_lib_eterm:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  # vendor fork 4.0.0-eterm.1：含 DEL 忽略 + 宽字符光标吸附两补丁（技术方案 §4.1）
  xterm:
    path: ../third_party/xterm
  web_socket_channel: ^3.0.3
  # SFTP 上传/下载的本地文件选择（SAF / NSSavePanel）
  file_selector: ^1.1.0
  package_info_plus: ^10.2.2
  # 更新包 sha256 校验（自动更新方案 §5.1；显式声明，不依赖传递依赖）
  crypto: ^3.0.3

# 镜像源曾把 foundation 解析到不存在的 1.9.1（无 macos 插件声明，导致注册表缺插件、
# 桌面启动黑窗）。钉住已缓存的 2.6.0；镜像修复后可移除。
dependency_overrides:
  path_provider_foundation: 2.6.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^2.5.7
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon-1024.png

# 应用图标生成（dart run flutter_launcher_icons）
flutter_launcher_icons:
  image_path: assets/icon/icon-1024.png
  android: true
  adaptive_icon_background: "#1F2633"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  # ⚠️ remove_alpha_ios 是根级键（0.14.4 只从根级反序列化，放 ios: 块内会被静默忽略
  # → 1024 图标带 alpha 上传 ASC 被 ITMS-90717 拒，review P1#1 实锤）
  remove_alpha_ios: true
  ios:
    generate: true
  macos:
    generate: true
  windows:
    generate: true  # 生成 windows/runner/resources/app_icon.ico 并更新 Runner.rc（D13 品牌口径）
