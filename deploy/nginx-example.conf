# eterm — hub.example.com
# eterm 是主机与凭据数据枢纽（Node 22 + TS + Fastify；Go 段落是过时遗留，见 AGENTS.md）。
# 原方案为服务自监听 0.0.0.0:8443 + 自签名证书；现改为 eterm 以明文 HTTP 监听 8220，
# TLS 全部由 nginx 终结，服务只需绑定 127.0.0.1 即可不直接对外暴露。
#
# 路由形态：纯 API，前缀 /api/v1（/healthz 为无鉴权探针），无前端静态页。
# eterm 的 ETERM_TLS_TRUSTED_PROXY 默认 127.0.0.1，nginx 回源地址正好落在受信代理内，
# X-Forwarded-For / X-Forwarded-Proto 会被后端正确采用。

# WebSocket 连接升级头
map $http_upgrade $eterm_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com;

    # ACME HTTP-01 校验
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name hub.example.com;

    ssl_certificate /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 凭据与 SSH 相关服务，放宽请求体上限以支持公钥/证书等较大载荷
    client_max_body_size 32m;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 客户端自动更新分发（Android/macOS/Windows 三端共用） ----------
    # 版本元数据 + 安装包静态可读（无鉴权，登录前/中枢宕机时也能检查）。
    # 注意 nginx add_header 继承规则：location 内一旦出现自己的 add_header，
    # server 级三条安全响应头对本 location 不再继承——必须重复声明（自动更新方案 §4）。
    location /updates/ {
        alias /opt/mao-data/uploads/eterm/;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8220;
        proxy_http_version 1.1;

        # 透传 Host，后端按 Host 生成绝对地址
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # ---------- WebSocket（终端 / 事件推送） ----------
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $eterm_conn_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # API 响应不缓冲，SSE/流式与 WS 才能实时
        proxy_buffering off;
    }
}
