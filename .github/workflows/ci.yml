name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 密钥泄露扫描（当前树；历史全量扫描见 .gitleaks.toml 注释，作为开源前独立检查项）
  gitleaks:
    name: gitleaks（密钥泄露）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gitleaks-action@v2 不接受 args（其默认按 git 区间扫描，浅克隆会
      # unknown revision 失败），且本项目门禁口径是「当前树」而非历史
      # （见 .gitleaks.toml），因此直接用官方 CLI 跑 --no-git。
      # 版本固定；tar 包与同 release 的 checksums 校验后再执行。
      - name: 扫描当前树（gitleaks --no-git）
        run: |
          set -euo pipefail
          V=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          TAR="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL "${BASE}/${TAR}" -o "/tmp/${TAR}"
          curl -sSfL "${BASE}/gitleaks_${V}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          (cd /tmp && grep "${TAR}" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${TAR}" -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --redact --verbose --config .gitleaks.toml

  server:
    name: server（typecheck + test）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: npm ci
        run: npm ci
        working-directory: server
      - name: typecheck
        run: npm run typecheck
        working-directory: server
      - name: 建测试库（fixture 按测试随机建库，需 CREATE/DROP 权限）
        run: mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS eterm_test CHARACTER SET utf8mb4"
      - name: test
        run: npm test
        working-directory: server
        env:
          ETERM_TEST_DSN: root:root@tcp(127.0.0.1:3306)/eterm_test?parseTime=true&multiStatements=true&loc=UTC

  rust:
    name: rust core（cargo test --lib）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --lib
        run: cargo test --lib
        working-directory: client/app/rust

  flutter:
    name: flutter（analyze + test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cnativeapi（native assets 构建钩子）需要 GTK3/X11/Xi 的开发头文件；
      # ubuntu-latest 默认不带，flutter test 会在构建 assets 阶段直接失败。
      - name: 安装 native assets 依赖（GTK3/X11/Xi）
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
        working-directory: client/app
      - name: flutter analyze
        run: flutter analyze
        working-directory: client/app
      - name: flutter test
        run: flutter test
        working-directory: client/app
